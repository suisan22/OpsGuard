services:
  # 1. Backend API (FastAPI)
  - type: web
    name: opsguard-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: postgresql+psycopg2://opsguard_user:opsguard_password@localhost:5432/opsguard_db
      - key: JWT_SECRET_KEY
        value: opsguard_render_secret_key_2026_xyz
    dockerCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port 10000

  # 2. Frontend Web App (Next.js)
  - type: web
    name: opsguard-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: PORT
        value: 3000

  # 3. Background Worker Process
  - type: web
    name: opsguard-worker
    env: docker
    dockerfilePath: ./worker/Dockerfile
    dockerContext: ./worker
    plan: free
    envVars:
      - key: PORT
        value: 8081